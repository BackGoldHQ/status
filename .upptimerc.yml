# BackGold status page — https://status.backgold.com
# Monitoring runs on GitHub Actions and the page is served by GitHub Pages:
# nothing here runs on Cloudflare, so the page stays up when BackGold is down.
# Reference: https://upptime.js.org/docs/configuration
owner: BackGoldHQ
repo: status
user-agent: BackGoldHQ-status

sites:
  - name: Marketing site
    url: https://backgold.com
  - name: Operator app
    url: https://app.backgold.com
  - name: Donate pages
    url: https://secure.backgold.com
  - name: Donor portal
    url: https://giving.backgold.com
  - name: API
    url: https://api.backgold.com/health
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: healthy
  - name: Realtime (chat, calls, presence)
    url: https://realtime.backgold.com/health
    expectedStatusCodes:
      - 200

assignees:
  - jhliberty

status-website:
  cname: status.backgold.com
  logoUrl: https://raw.githubusercontent.com/BackGoldHQ/status/master/assets/backgold-logo.svg
  name: BackGold Status
  introTitle: "Current status of **BackGold** services."
  introMessage: Checks run every five minutes from GitHub Actions, and this page is served by GitHub Pages, so it stays up when our own infrastructure does not. Incidents are posted as issues in the [status repository](https://github.com/BackGoldHQ/status/issues?q=is%3Aissue+label%3Astatus).
  navbar:
    - title: Status
      href: /
    - title: Incidents
      href: https://github.com/BackGoldHQ/status/issues?q=is%3Aissue+label%3Astatus
    - title: BackGold
      href: https://backgold.com
